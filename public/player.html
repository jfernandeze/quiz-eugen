<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugen Quiz - Participante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="player-body">
    <div class="container player-container">
        <header class="player-header">
            <h1>⚡ Eugen Quiz</h1>
            <p style="margin-top: 10px; opacity: 0.95; font-size: 1em; font-weight: 500;">Libera el color</p>
            <p style="margin-top: 5px; opacity: 0.85; font-size: 0.85em;">Más cercano, menos complicado</p>
        </header>

        <div class="player-content">
            <div id="waitingScreen" class="screen active">
                <div class="waiting-message">
                    <div class="spinner"></div>
                    <h2>Esperando la pregunta...</h2>
                    <p>El administrador iniciará la pregunta pronto</p>
                </div>
            </div>

            <div id="questionScreen" class="screen">
                <div class="question-header">
                    <span class="question-number" id="questionNumber">Pregunta 1 de 5</span>
                </div>
                <div class="question-card">
                    <h2 id="questionText">¿Cuál es la pregunta?</h2>
                    <div class="options-container" id="optionsContainer">
                        <!-- Las opciones se cargarán dinámicamente -->
                    </div>
                    <button onclick="submitAnswer()" class="btn-submit" id="submitBtn" disabled>Enviar Respuesta</button>
                </div>
            </div>

            <div id="answeredScreen" class="screen">
                <div class="answered-message">
                    <div class="checkmark">✓</div>
                    <h2>¡Respuesta Enviada!</h2>
                    <p>Espera a que el administrador muestre los resultados</p>
                </div>
            </div>

            <div id="resultsScreen" class="screen">
                <div class="results-card">
                    <h2>Resultados</h2>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </div>

        <div class="player-name-input" id="nameInputSection">
            <input type="text" id="playerName" placeholder="Ingresa tu nombre" maxlength="30">
            <button onclick="registerPlayer()" class="btn-primary">Entrar al Juego</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="player.js"></script>
</body>
</html>
