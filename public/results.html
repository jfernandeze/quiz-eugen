<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados en Vivo - Eugen Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="results-body">
    <div class="container results-container">
        <header class="results-header">
            <h1>⚡ Eugen Quiz - Resultados en Vivo</h1>
            <p style="margin-top: 10px; opacity: 0.95; font-size: 1.1em; font-weight: 500;">Libera el color</p>
            <p style="margin-top: 5px; opacity: 0.85; font-size: 0.95em;">Más cercano, menos complicado</p>
        </header>

        <div class="results-content">
            <div id="noResults" class="no-results">
                <p>Esperando resultados...</p>
            </div>

            <div id="resultsDisplay" class="results-display" style="display: none;">
                <div class="question-display">
                    <h2 id="resultQuestionText"></h2>
                    <div class="question-info">
                        <span id="resultQuestionNumber"></span>
                        <span id="totalAnswers">0 respuestas</span>
                    </div>
                </div>

                <div class="stats-container" id="statsContainer">
                    <!-- Las estadísticas se mostrarán aquí -->
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="results.js"></script>
    <footer style="text-align: center; color: rgba(255,255,255,0.7); margin-top: 30px; padding: 20px; font-size: 0.85em;">
        <p>Eugen - Tecnología y Gestión de Siniestros</p>
        <p style="margin-top: 5px; font-size: 0.9em;">100% de la gestión del siniestro | <a href="https://eugen.solutions" target="_blank" style="color: rgba(255,255,255,0.9); text-decoration: underline;">eugen.solutions</a></p>
    </footer>
</body>
</html>
